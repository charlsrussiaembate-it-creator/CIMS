<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CIMS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600;1,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles/loading.css" />
  </head>

  <body>
    <!-- Isometric Cube Loader -->
    <div class="loader-overlay" id="app-loader">
      <span class="loader-6"></span>
    </div>

    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>

    <script>
      (function () {
        var loader = document.getElementById("app-loader");
        var root = document.getElementById("root");
        if (!loader || !root) return;

        var removed = false;
        function hideLoader() {
          if (removed) return;
          removed = true;
          loader.classList.add("is-hidden");
          loader.addEventListener(
            "transitionend",
            function () {
              if (loader.parentNode) loader.parentNode.removeChild(loader);
            },
            { once: true },
          );
        }

        if (root.childElementCount > 0) {
          hideLoader();
        } else {
          var observer = new MutationObserver(function () {
            if (root.childElementCount > 0) {
              observer.disconnect();
              hideLoader();
            }
          });
          observer.observe(root, { childList: true });
        }

        setTimeout(hideLoader, 6000);
      })();
    </script>
  </body>
</html>
