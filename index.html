<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sys_project</title>
    <style>
      .app-loading {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0b1120;
        color: #f1f5f9;
        font-family: "DM Sans", system-ui, sans-serif;
      }

      .app-loading__content {
        display: grid;
        justify-items: center;
        gap: 16px;
      }

      .app-loading__mark {
        display: grid;
        width: 48px;
        height: 48px;
        place-items: center;
        border-radius: 10px;
        background: #0ea5e9;
        color: #07111e;
        font-size: 18px;
        font-weight: 700;
        animation: app-loading-pulse 1.4s ease-in-out infinite;
      }

      .app-loading__text {
        margin: 0;
        color: #94a3b8;
        font-size: 13px;
        letter-spacing: 0.04em;
      }

      @keyframes app-loading-pulse {
        0%, 100% { opacity: 0.55; transform: scale(0.96); }
        50% { opacity: 1; transform: scale(1); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="app-loading" aria-live="polite" aria-busy="true">
        <div class="app-loading__content">
          <div class="app-loading__mark" aria-hidden="true">CI</div>
          <p class="app-loading__text">Loading CIMS...</p>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
